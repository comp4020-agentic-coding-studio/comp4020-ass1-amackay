<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proof blocks</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="page-head">
      <h1>Proof blocks</h1>
      <nav aria-label="Primary">
        <a href="./" aria-current="page">Sandbox</a>
      </nav>
    </header>
    <main class="workspace">
      <section class="region palette" aria-label="Palette" data-palette>
        <p class="region-label">Palette</p>
        <!-- The blocks inside are generated and each carries data-core-interaction
             too; it is on the container as well so the built page names the
             interaction without having run any script. -->
        <div
          class="palette-blocks"
          data-palette-blocks
          data-core-interaction
          tabindex="0"
          role="group"
          aria-label="Blocks to drag onto the bench"
        ></div>
      </section>
      <section class="region bench" aria-label="Bench" data-bench>
        <p class="region-label">Bench</p>
        <div class="bench-cards" data-bench-cards data-core-output></div>
      </section>
    </main>
    <div class="delete-target" data-delete aria-hidden="true">
      <span class="delete-target__mark">&times;</span>
      <span class="delete-target__label">Drop to discard</span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
