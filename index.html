<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proof blocks</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- The page carries no visible navigation: it is one canvas. The landmark
         is here because spec/invariants.test.ts requires every page to have one. -->
    <nav class="visually-hidden" aria-label="Primary">
      <a href="./" aria-current="page">Sandbox</a>
    </nav>
    <main class="workspace">
      <!-- The canvas is the page. It runs edge to edge and the tray floats over
           it, so the bench comes first in the DOM and the tray paints on top. -->
      <section class="bench" aria-label="Bench" data-bench>
        <div class="bench-cards" data-bench-cards data-core-output></div>
      </section>
      <section class="tray" aria-label="Palette" data-palette>
        <div class="tray-head">
          <h1>Proof blocks</h1>
        </div>
        <!-- The blocks inside are generated and each carries data-core-interaction
             too; it is on the container as well so the built page names the
             interaction without having run any script. -->
        <div
          class="palette-blocks"
          data-palette-blocks
          data-core-interaction
          tabindex="0"
          role="group"
          aria-label="Blocks to drag onto the bench"
        ></div>
        <div
          class="tray-handle"
          data-tray-handle
          role="separator"
          aria-orientation="vertical"
          aria-label="Palette size"
          tabindex="0"
        ></div>
      </section>
      <div class="delete-target" data-delete aria-hidden="true">
        <span class="delete-target__mark">&times;</span>
        <span class="delete-target__label">Drop to discard</span>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
